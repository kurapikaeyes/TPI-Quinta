<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Feedback</title>
    <script src="script01.js" defer></script>
</head>
<body>
 
    <h1>Modulo di Feedback</h1>
   
    <form id="form">
        <fieldset>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" name="nome">
            <br><br>
 
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email">
            <br><br>
 
            <label for="data">Data</label><br>
            <input type="date" id="data" name="data">
            <br><br>
 
            <label for="ora">Ora</label><br>
            <input type="time" id="ora" name="ora">
            <br><br>
 
            <label for="tipoFeedback">Tipo di Feedback</label><br>
            <select id="tipoFeedback" name="tipoFeedback">
                <option value="Positivo">Positivo</option>
                <option value="Negativo">Negativo</option>
            </select>
            <br><br>
           
            <label for="testoFeedback">Messaggio</label><br>
            <textarea id="testoFeedback" name="testoFeedback" rows="5" cols="30"></textarea>
            <br><br>
 
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Iscriviti alla newsletter</label>
            <br><br>
           
            <button type="submit">Invia</button>
        </fieldset>
    </form>
 
    <h2>Feedback Ricevuti</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Data</th>
                <th>Ora</th>
                <th>Tipo</th>
                <th>Messaggio</th>
                <th>Newsletter</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody id="tabellaFeedback">
        </tbody>
    </table>
 
</body>
</html>
